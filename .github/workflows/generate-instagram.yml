name: Publish Instagram Lessons Sequentially

on:
  workflow_dispatch:
    inputs:
      lesson_number:
        description: "Optional lesson number for a one-time manual repost. Leave blank for normal sequential publishing."
        required: false
        type: string
  schedule:
    - cron: "10 13 * * 1,3,5"

concurrency:
  group: instagram-sequential-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Synchronize with latest main before selecting lesson
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lesson generation dependencies
        run: pip install -r requirements-instagram.txt

      - name: Prepare next sequential lesson
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lesson_number == '') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          OPENAI_IMAGE_MODEL: gpt-image-1.5
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          NEXT_LESSON=$(python -c 'import json; print(int(json.load(open("instagram/publish_state.json"))["last_published_lesson"]) + 1)')
          LESSON_DIR=$(printf "instagram/lesson-%03d" "$NEXT_LESSON")
          if [ -f "$LESSON_DIR/manifest.json" ]; then
            python - "$NEXT_LESSON" <<'PY'
          import json,sys
          from pathlib import Path
          n=int(sys.argv[1]); p=Path(f"instagram/lesson-{n:03d}/enhanced_v3.json")
          try:
              d=json.loads(p.read_text())
              if d.get("style") != "photo-led-topic-specific" or d.get("visual_version") != 3:
                  raise ValueError("Not photo-led")
              print("Existing lesson has a photo-led marker; reusing existing assets.")
          except (FileNotFoundError,ValueError,json.JSONDecodeError):
              print("Existing lesson is not verified photo-led; rebuilding.")
              import subprocess,os
              env=os.environ.copy();env["LESSON_NUMBER"]=str(n)
              subprocess.run(["python","scripts/refresh_instagram_lesson_v3.py"],env=env,check=True)
          PY
          else
            python scripts/prepare_instagram_lesson.py
          fi

      - name: Commit refreshed/generated lesson
        run: |
          git config user.name "actions-user"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Instagram lesson with photo-led visual system"
            git pull --rebase origin main
            git push
          else
            echo "No lesson graphics changes to commit."
          fi

      - name: Wait for generated images on GitHub Pages
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lesson_number == '') }}
        run: |
          echo "Giving GitHub Pages time to start deployment. The resilient publisher will then verify every slide before contacting Instagram."
          sleep 180

      - name: Publish specific lesson manually
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.lesson_number != '' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          LESSON_NUMBER: ${{ inputs.lesson_number }}
        run: python scripts/publish_specific_instagram.py

      - name: Publish next sequential lesson
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lesson_number == '') }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/publish_instagram_resilient.py

      - name: Save Instagram publish state
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lesson_number == '') }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/publish_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Instagram publish state"
            git pull --rebase origin main
            git push
          else
            echo "Publish state already current."
          fi
