name: Publish Instagram Lessons Sequentially

on:
  workflow_dispatch:
    inputs:
      lesson_number:
        description: "Optional lesson number for a one-time manual repost. Leave blank for normal sequential publishing."
        required: false
        type: string
  schedule:
    - cron: "10 13 * * 1,3,5"

permissions:
  contents: write

jobs:
  publish-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lesson generation dependencies
        run: pip install -r requirements-instagram.txt

      - name: Prepare next sequential lesson
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lesson_number == '') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/prepare_instagram_lesson.py

      - name: Refresh specific lesson for manual repost
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.lesson_number != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-1' }}
          LESSON_NUMBER: ${{ inputs.lesson_number }}
        run: python scripts/refresh_instagram_lesson_v3.py

      - name: Commit refreshed/generated lesson
        run: |
          git config user.name "actions-user"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Instagram lesson with photo-led visual system"
            git pull --rebase origin main
            git push
          else
            echo "No lesson graphics changes to commit."
          fi

      - name: Wait for refreshed images on GitHub Pages
        run: sleep 90

      - name: Publish specific lesson manually
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.lesson_number != '' }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          LESSON_NUMBER: ${{ inputs.lesson_number }}
        run: python scripts/publish_specific_instagram.py

      - name: Publish next sequential lesson
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lesson_number == '') }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/publish_instagram_resilient.py

      - name: Save Instagram publish state
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.lesson_number == '') }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/publish_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Instagram publish state"
            git pull --rebase origin main
            git push
          else
            echo "Publish state already current."
          fi
