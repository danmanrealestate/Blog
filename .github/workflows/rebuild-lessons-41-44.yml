name: Rebuild Lessons 41-44 With Real Property Photos (No Publishing)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-sequential-publisher
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-instagram.txt
      - name: Generate seven photographic slides for each lesson
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          OPENAI_IMAGE_MODEL: gpt-image-1.5
        run: |
          set -e
          for n in 41 42 43 44; do
            echo "Generating photo-led Lesson $n"
            LESSON_NUMBER="$n" python scripts/refresh_instagram_lesson_v3.py
          done
      - name: Verify 28 actual JPEGs and photo-led metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          for n in range(41,45):
              folder=Path(f"instagram/lesson-{n:03d}")
              d=json.loads((folder/"enhanced_v3.json").read_text())
              assert d["style"]=="photo-led-topic-specific" and d["visual_version"]==3
              for i in range(1,8):
                  p=folder/f"slide{i}.jpg"
                  with Image.open(p) as im:
                      assert im.size==(1080,1350), (p,im.size)
                      im.verify()
              print(f"Verified Lesson {n}")
          PY
      - name: Commit photo-led lesson images
        run: |
          git config user.name "actions-user"
          git config user.email "actions@users.noreply.github.com"
          git add instagram/lesson-041 instagram/lesson-042 instagram/lesson-043 instagram/lesson-044
          git diff --cached --quiet && exit 0
          git commit -m "Restore photo-led visuals for Instagram lessons 41-44"
          git pull --rebase origin main
          git push origin main
