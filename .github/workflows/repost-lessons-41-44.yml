name: Repost Rebuilt Instagram Lessons 41-44

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-sequential-publisher
  cancel-in-progress: false

jobs:
  repost:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all 28 rebuilt slide URLs
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          for n in range(41,45):
              folder=Path(f"instagram/lesson-{n:03d}")
              manifest=json.loads((folder/"manifest.json").read_text())
              marker=json.loads((folder/"enhanced_v3.json").read_text())
              assert marker["visual_version"] == 3 and marker["style"] == "photo-led-topic-specific", f"Lesson {n} has not been rebuilt with photos"
              assert len(manifest["files"]) == 7
              for i,item in enumerate(manifest["files"],1):
                  url=item["photo"]
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      assert response.status==200 and response.headers.get("Content-Type","").startswith("image/"),(n,i,url)
              print(f"Lesson {n}: all seven images available")
          PY
      - name: Repost each lesson once and save progress
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          set -e
          for n in 41 42 43 44; do
            git fetch origin main
            git pull --ff-only origin main
            marker="instagram/lesson-$(printf '%03d' "$n")/repost_completed.json"
            if [ -f "$marker" ]; then
              echo "Lesson $n previously reposted successfully; skipping to prevent duplicate."
              continue
            fi
            echo "Reposting lesson $n"
            LESSON_NUMBER="$n" python scripts/publish_specific_instagram.py
            printf '{"lesson":%s,"reposted":true,"workflow":"repost-lessons-41-44"}\n' "$n" > "$marker"
            git config user.name "actions-user"
            git config user.email "actions@users.noreply.github.com"
            git add "$marker"
            git commit -m "Record successful Instagram repost of lesson $n"
            git pull --rebase origin main
            git push origin main
          done
          echo "All four reposts complete. Sequential publishing counter was not changed."
